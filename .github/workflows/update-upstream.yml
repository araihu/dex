name: Update upstream Dex

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Prepare verified update
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read locked tool versions
        id: versions
        shell: bash
        run: |
          node_version=$(sed -n 's/^NODE_VERSION=//p' versions.env)
          npm_version=$(sed -n 's/^NPM_VERSION=//p' versions.env)
          actionlint_version=$(sed -n 's/^ACTIONLINT_VERSION=//p' versions.env)
          test -n "$node_version"
          test -n "$npm_version"
          test -n "$actionlint_version"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "npm=$npm_version" >> "$GITHUB_OUTPUT"
          echo "actionlint=$actionlint_version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install locked npm
        run: npm install --global "npm@${{ steps.versions.outputs.npm }}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare and verify update locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-lock.sh

      - name: Stage prepared files for drift checks
        run: |
          git add versions.env Dockerfile src/header.html src/footer.html \
            test/fetch-sources_test.sh test/image-overlay_test.sh web

      - name: Verify lock and generated drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/update-lock.sh --verify-lock
          scripts/fetch-sources.sh
          npm run generate
          git diff --exit-code

      - name: Run shell tests
        run: |
          sh test/fetch-sources_test.sh
          sh test/entrypoint_test.sh
          sh test/update-lock_test.sh
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@${{ steps.versions.outputs.actionlint }}
          git diff --cached --check

      - name: Run Node tests
        run: npm test

      - name: Build amd64 image locally
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --iidfile /tmp/araihu-dex-amd64.iid \
            --cache-to type=local,dest=/tmp/araihu-dex-cache-amd64,mode=max \
            .

      - name: Build arm64 image locally
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --output type=oci,dest=/tmp/araihu-dex-arm64.oci.tar \
            --cache-from type=local,src=/tmp/araihu-dex-cache-amd64 \
            --cache-to type=local,dest=/tmp/araihu-dex-cache-arm64,mode=max \
            .

      - name: Record local image ID
        id: image
        run: echo "id=$(cat /tmp/araihu-dex-amd64.iid)" >> "$GITHUB_OUTPUT"

      - name: Verify filesystem overlay
        run: sh test/image-overlay_test.sh "${{ steps.image.outputs.id }}"

      - name: Run real-image acceptance
        run: scripts/test-image.sh "${{ steps.image.outputs.id }}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.id }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload update evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-upstream-evidence
          path: |
            .cache/update-report.md
            test-results/
            playwright-report/
            trivy-results.sarif
            web/manifest.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Detect prepared changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push update branch
        if: ${{ steps.changes.outputs.changed == 'true' }}
        id: branch
        run: |
          commit=$(sed -n 's/^DEX_COMMIT=//p' versions.env)
          short_commit=${commit:0:12}
          branch="automation/update-dex-$short_commit"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update Dex master to $short_commit"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"

      - name: Open update pull request
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore: update Dex master to ${{ steps.branch.outputs.short_commit }}" \
            --body-file .cache/update-report.md
