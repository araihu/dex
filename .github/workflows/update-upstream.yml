name: Update upstream Dex

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Prepare and verify update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.bundle.outputs.changed }}
      base_commit: ${{ steps.bundle.outputs.base_commit }}
      patch_sha256: ${{ steps.bundle.outputs.patch_sha256 }}
      report_sha256: ${{ steps.bundle.outputs.report_sha256 }}
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
      metadata_sha256: ${{ steps.bundle.outputs.metadata_sha256 }}
      new_commit: ${{ steps.bundle.outputs.new_commit }}
      new_digest: ${{ steps.bundle.outputs.new_digest }}
      artifact_id: ${{ steps.prepared_artifact.outputs.artifact-id }}

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Read locked tool versions
        id: versions
        shell: bash
        run: |
          node_version=$(sed -n 's/^NODE_VERSION=//p' versions.env)
          npm_version=$(sed -n 's/^NPM_VERSION=//p' versions.env)
          actionlint_version=$(sed -n 's/^ACTIONLINT_VERSION=//p' versions.env)
          test -n "$node_version"
          test -n "$npm_version"
          test -n "$actionlint_version"
          {
            echo "node=$node_version"
            echo "npm=$npm_version"
            echo "actionlint=$actionlint_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install locked npm
        run: npm install --global "npm@${{ steps.versions.outputs.npm }}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare and verify update locally
        run: scripts/update-lock.sh

      - name: Stage prepared files for drift checks
        run: |
          git add --all -- versions.env Dockerfile src/header.html src/footer.html \
            test/fetch-sources_test.sh test/image-overlay_test.sh web

      - name: Verify lock and generated drift
        run: |
          scripts/update-lock.sh --verify-lock
          scripts/fetch-sources.sh
          npm run generate
          git diff --exit-code

      - name: Run shell tests
        run: |
          sh test/fetch-sources_test.sh
          sh test/entrypoint_test.sh
          sh test/update-lock_test.sh
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@${{ steps.versions.outputs.actionlint }}
          git diff --cached --check

      - name: Run Node tests
        run: npm test

      - name: Build amd64 image locally
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --iidfile /tmp/araihu-dex-amd64.iid \
            .

      - name: Record local image ID
        id: image
        run: echo "id=$(cat /tmp/araihu-dex-amd64.iid)" >> "$GITHUB_OUTPUT"

      - name: Verify filesystem overlay
        run: sh test/image-overlay_test.sh "${{ steps.image.outputs.id }}"

      - name: Run real-image acceptance
        run: scripts/test-image.sh "${{ steps.image.outputs.id }}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.id }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload update evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-upstream-evidence
          path: |
            .cache/update-report.md
            test-results/
            playwright-report/
            trivy-results.sarif
            web/manifest.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Create checksum-bound prepared update
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          base_commit=$(git rev-parse HEAD)
          test "$base_commit" = "$GITHUB_SHA"
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bundle=.cache/prepared-update
          mkdir -p "$bundle"
          git diff --cached --binary --full-index > "$bundle/prepared-update.patch"
          cp .cache/update-report.md "$bundle/update-report.md"
          cp web/manifest.sha256 "$bundle/manifest.sha256"

          new_commit=$(sed -n 's/^DEX_COMMIT=//p' versions.env)
          new_image=$(sed -n 's/^DEX_IMAGE=//p' versions.env)
          new_digest=${new_image##*@}
          patch_sha256=$(sha256sum "$bundle/prepared-update.patch" | awk '{print $1}')
          report_sha256=$(sha256sum "$bundle/update-report.md" | awk '{print $1}')
          manifest_sha256=$(sha256sum "$bundle/manifest.sha256" | awk '{print $1}')
          {
            echo 'format=1'
            echo "base_commit=$base_commit"
            echo "new_commit=$new_commit"
            echo "new_digest=$new_digest"
            echo "patch_sha256=$patch_sha256"
            echo "report_sha256=$report_sha256"
            echo "manifest_sha256=$manifest_sha256"
          } > "$bundle/metadata.env"
          metadata_sha256=$(sha256sum "$bundle/metadata.env" | awk '{print $1}')

          {
            echo 'changed=true'
            echo "patch_sha256=$patch_sha256"
            echo "report_sha256=$report_sha256"
            echo "manifest_sha256=$manifest_sha256"
            echo "metadata_sha256=$metadata_sha256"
            echo "new_commit=$new_commit"
            echo "new_digest=$new_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Upload checksum-bound prepared update
        if: ${{ steps.bundle.outputs.changed == 'true' }}
        id: prepared_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/prepared-update/
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate prepared artifact read-only
    needs: verify
    if: ${{ needs.verify.result == 'success' && needs.verify.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.validate.outputs.artifact_id }}
      base_commit: ${{ steps.validate.outputs.base_commit }}
      binding_sha256: ${{ steps.validate.outputs.binding_sha256 }}

    steps:
      - name: Check out verified base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.base_commit }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Download verified prepared update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: .cache/prepared-update

      - name: Validate prepared update
        id: validate
        shell: bash
        env:
          EXPECTED_BASE_COMMIT: ${{ needs.verify.outputs.base_commit }}
          EXPECTED_PATCH_SHA256: ${{ needs.verify.outputs.patch_sha256 }}
          EXPECTED_REPORT_SHA256: ${{ needs.verify.outputs.report_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
          EXPECTED_METADATA_SHA256: ${{ needs.verify.outputs.metadata_sha256 }}
          EXPECTED_NEW_COMMIT: ${{ needs.verify.outputs.new_commit }}
          EXPECTED_NEW_DIGEST: ${{ needs.verify.outputs.new_digest }}
          EXPECTED_WORKFLOW_COMMIT: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: |
          set -euo pipefail
          bundle=.cache/prepared-update
          metadata=$bundle/metadata.env
          patch=$bundle/prepared-update.patch
          report=$bundle/update-report.md
          manifest=$bundle/manifest.sha256
          test -f "$metadata"
          test -f "$patch"
          test -f "$report"
          test -f "$manifest"

          metadata_value() {
            local key=$1
            local count
            count=$(awk -F= -v key="$key" '$1 == key { count++ } END { print count + 0 }' "$metadata")
            test "$count" -eq 1
            awk -v prefix="$key=" 'index($0, prefix) == 1 { print substr($0, length(prefix) + 1); exit }' "$metadata"
          }

          test "$(wc -l < "$metadata" | tr -d ' ')" -eq 7
          test "$(metadata_value format)" = 1
          base_commit=$(metadata_value base_commit)
          new_commit=$(metadata_value new_commit)
          new_digest=$(metadata_value new_digest)
          patch_sha256=$(metadata_value patch_sha256)
          report_sha256=$(metadata_value report_sha256)
          manifest_sha256=$(metadata_value manifest_sha256)
          test "$base_commit" = "$EXPECTED_BASE_COMMIT"
          test "$base_commit" = "$EXPECTED_WORKFLOW_COMMIT"
          test "$(git rev-parse HEAD)" = "$base_commit"
          test "$new_commit" = "$EXPECTED_NEW_COMMIT"
          test "$new_digest" = "$EXPECTED_NEW_DIGEST"
          test "$patch_sha256" = "$EXPECTED_PATCH_SHA256"
          test "$report_sha256" = "$EXPECTED_REPORT_SHA256"
          test "$manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$metadata" | awk '{print $1}')" = "$EXPECTED_METADATA_SHA256"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$patch_sha256"
          test "$(sha256sum "$report" | awk '{print $1}')" = "$report_sha256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$manifest_sha256"
          [[ "$new_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$new_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          git apply --check "$patch"
          git apply --index "$patch"
          test "$(git diff --cached --binary --full-index | sha256sum | awk '{print $1}')" = "$patch_sha256"
          git diff --exit-code
          git diff --cached --check

          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "$path" in
              versions.env|Dockerfile|src/header.html|src/footer.html) ;;
              test/fetch-sources_test.sh|test/image-overlay_test.sh) ;;
              web/*) ;;
              *) echo "unexpected prepared path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only -z)
          test "$changed" = true

          test "$(sed -n 's/^DEX_COMMIT=//p' versions.env)" = "$new_commit"
          locked_image=$(sed -n 's/^DEX_IMAGE=//p' versions.env)
          test "${locked_image##*@}" = "$new_digest"
          grep -F -x -- "- New commit: \`$new_commit\`" "$report"
          grep -F -x -- "- New digest: \`$new_digest\`" "$report"
          grep -F -x -- "- Generated manifest digest: \`sha256:$manifest_sha256\`" "$report"

          binding_sha256=$(
            printf '%s\n' \
              "artifact_id=$EXPECTED_ARTIFACT_ID" \
              "base_commit=$base_commit" \
              "new_commit=$new_commit" \
              "new_digest=$new_digest" \
              "patch_sha256=$patch_sha256" \
              "report_sha256=$report_sha256" \
              "manifest_sha256=$manifest_sha256" \
              "metadata_sha256=$EXPECTED_METADATA_SHA256" |
              sha256sum | awk '{print $1}'
          )
          {
            echo "artifact_id=$EXPECTED_ARTIFACT_ID"
            echo "base_commit=$base_commit"
            echo "binding_sha256=$binding_sha256"
          } >> "$GITHUB_OUTPUT"

  verify-arm64:
    name: Build prepared arm64 image natively
    needs: [verify, validate]
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the verified base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.base_commit }}
          persist-credentials: false
      - name: Download validated prepared update
        if: ${{ needs.verify.outputs.changed == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/prepared-update
      - name: Apply the exact validated patch
        if: ${{ needs.verify.outputs.changed == 'true' }}
        shell: bash
        env:
          EXPECTED_BASE_COMMIT: ${{ needs.validate.outputs.base_commit }}
          EXPECTED_PATCH_SHA256: ${{ needs.verify.outputs.patch_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_COMMIT"
          patch=$RUNNER_TEMP/prepared-update/prepared-update.patch
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          git apply --check "$patch"
          git apply --index "$patch"
          git diff --exit-code
          git diff --cached --check
      - name: Set up Go for verified source acquisition
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Fetch verified prepared build sources
        run: scripts/fetch-sources.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build prepared arm64 image natively
        run: docker buildx build --platform linux/arm64 --load --tag araihu-dex:upstream-arm64 .

  publish:
    name: Publish validated update artifact
    needs: [validate, verify-arm64]
    if: ${{ needs.validate.result == 'success' && needs.verify-arm64.result == 'success' && needs.validate.outputs.binding_sha256 != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download validated prepared update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/prepared-update

      - name: Pre-check immutable artifact binding
        id: precheck
        shell: bash
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          EXPECTED_BASE_COMMIT: ${{ needs.validate.outputs.base_commit }}
          EXPECTED_BINDING_SHA256: ${{ needs.validate.outputs.binding_sha256 }}
        run: |
          set -euo pipefail
          bundle=$RUNNER_TEMP/prepared-update
          metadata=$bundle/metadata.env
          patch=$bundle/prepared-update.patch
          report=$bundle/update-report.md
          manifest=$bundle/manifest.sha256
          for artifact_file in "$metadata" "$patch" "$report" "$manifest"; do
            test -f "$artifact_file"
            test ! -L "$artifact_file"
          done
          test "$(find "$bundle" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" -eq 4

          metadata_value() {
            local key=$1
            local count
            count=$(awk -F= -v key="$key" '$1 == key { count++ } END { print count + 0 }' "$metadata")
            test "$count" -eq 1
            awk -v prefix="$key=" 'index($0, prefix) == 1 { print substr($0, length(prefix) + 1); exit }' "$metadata"
          }

          test "$(wc -l < "$metadata" | tr -d ' ')" -eq 7
          test "$(metadata_value format)" = 1
          base_commit=$(metadata_value base_commit)
          new_commit=$(metadata_value new_commit)
          new_digest=$(metadata_value new_digest)
          patch_sha256=$(metadata_value patch_sha256)
          report_sha256=$(metadata_value report_sha256)
          manifest_sha256=$(metadata_value manifest_sha256)
          metadata_sha256=$(sha256sum "$metadata" | awk '{print $1}')
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_BINDING_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$base_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$new_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$new_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$patch_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$report_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$base_commit" = "$EXPECTED_BASE_COMMIT"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$patch_sha256"
          test "$(sha256sum "$report" | awk '{print $1}')" = "$report_sha256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$manifest_sha256"

          binding_sha256=$(
            printf '%s\n' \
              "artifact_id=$EXPECTED_ARTIFACT_ID" \
              "base_commit=$base_commit" \
              "new_commit=$new_commit" \
              "new_digest=$new_digest" \
              "patch_sha256=$patch_sha256" \
              "report_sha256=$report_sha256" \
              "manifest_sha256=$manifest_sha256" \
              "metadata_sha256=$metadata_sha256" |
              sha256sum | awk '{print $1}'
          )
          test "$binding_sha256" = "$EXPECTED_BINDING_SHA256"

          numstat=$RUNNER_TEMP/prepared-update.numstat
          git apply --numstat -z "$patch" > "$numstat"
          changed=false
          while IFS=$'\t' read -r -d '' _added _deleted path; do
            changed=true
            case "$path" in
              /*|../*|*/../*|*/..) ;;
              versions.env|Dockerfile|src/header.html|src/footer.html) continue ;;
              test/fetch-sources_test.sh|test/image-overlay_test.sh) continue ;;
              web/*) continue ;;
            esac
            echo "unexpected prepared path before publication: $path" >&2
            exit 1
          done < "$numstat"
          test "$changed" = true

          grep -F -x -- "- New commit: \`$new_commit\`" "$report"
          grep -F -x -- "- New digest: \`$new_digest\`" "$report"
          grep -F -x -- "- Generated manifest digest: \`sha256:$manifest_sha256\`" "$report"

          {
            echo "base_commit=$base_commit"
            echo "new_commit=$new_commit"
            echo "new_digest=$new_digest"
            echo "patch_sha256=$patch_sha256"
            echo "report_sha256=$report_sha256"
            echo "manifest_sha256=$manifest_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload validated update artifact
        id: validated_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-dex-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared-update/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize the validated proposal for manual review
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.validated_artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/prepared-update/update-report.md"
            printf '\nValidated with AMD64 image acceptance and a native ARM64 build.\n'
            printf '\n[Download the validated patch and report](%s)\n' "$ARTIFACT_URL"
            printf '\nApply prepared-update.patch to the base_commit recorded in metadata.env, review the changes and screenshots, then open a pull request manually.\n'
          } >> "$GITHUB_STEP_SUMMARY"
