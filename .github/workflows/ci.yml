name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify overlay
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read locked tool versions
        id: versions
        shell: bash
        run: |
          node_version=$(sed -n 's/^NODE_VERSION=//p' versions.env)
          npm_version=$(sed -n 's/^NPM_VERSION=//p' versions.env)
          actionlint_version=$(sed -n 's/^ACTIONLINT_VERSION=//p' versions.env)
          test -n "$node_version"
          test -n "$npm_version"
          test -n "$actionlint_version"
          {
            echo "node=$node_version"
            echo "npm=$npm_version"
            echo "actionlint=$actionlint_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install locked npm
        run: npm install --global "npm@${{ steps.versions.outputs.npm }}"

      - name: Install dependencies
        run: npm ci

      - name: Verify lock and sources
        run: |
          scripts/update-lock.sh --verify-lock
          scripts/fetch-sources.sh

      - name: Generate frontend
        run: npm run generate

      - name: Reject generated drift
        run: git diff --exit-code

      - name: Run shell tests
        run: |
          sh test/fetch-sources_test.sh
          sh test/entrypoint_test.sh
          sh test/update-lock_test.sh
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@${{ steps.versions.outputs.actionlint }}

      - name: Run Node tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build amd64 image locally
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --iidfile /tmp/araihu-dex-amd64.iid \
            --cache-to type=local,dest=/tmp/araihu-dex-cache-amd64,mode=max \
            .

      - name: Record local image ID
        id: image
        run: echo "id=$(cat /tmp/araihu-dex-amd64.iid)" >> "$GITHUB_OUTPUT"

      - name: Verify filesystem overlay
        run: sh test/image-overlay_test.sh "${{ steps.image.outputs.id }}"

      - name: Run real-image acceptance
        run: scripts/test-image.sh "${{ steps.image.outputs.id }}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.id }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload test and scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence
          path: |
            test-results/
            playwright-report/
            trivy-results.sarif
            web/manifest.sha256
          if-no-files-found: warn
          retention-days: 14

  build-arm64:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Fetch verified build sources
        run: scripts/fetch-sources.sh

      - name: Build arm64 image natively
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --output type=oci,dest=/tmp/araihu-dex-arm64.oci.tar \
            .
