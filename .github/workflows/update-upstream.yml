name: Update upstream Dex

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Prepare and verify update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.bundle.outputs.changed }}
      base_commit: ${{ steps.bundle.outputs.base_commit }}
      patch_sha256: ${{ steps.bundle.outputs.patch_sha256 }}
      report_sha256: ${{ steps.bundle.outputs.report_sha256 }}
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
      metadata_sha256: ${{ steps.bundle.outputs.metadata_sha256 }}
      new_commit: ${{ steps.bundle.outputs.new_commit }}
      new_digest: ${{ steps.bundle.outputs.new_digest }}
      artifact_id: ${{ steps.prepared_artifact.outputs.artifact-id }}

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read locked tool versions
        id: versions
        shell: bash
        run: |
          node_version=$(sed -n 's/^NODE_VERSION=//p' versions.env)
          npm_version=$(sed -n 's/^NPM_VERSION=//p' versions.env)
          actionlint_version=$(sed -n 's/^ACTIONLINT_VERSION=//p' versions.env)
          test -n "$node_version"
          test -n "$npm_version"
          test -n "$actionlint_version"
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "npm=$npm_version" >> "$GITHUB_OUTPUT"
          echo "actionlint=$actionlint_version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install locked npm
        run: npm install --global "npm@${{ steps.versions.outputs.npm }}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare and verify update locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-lock.sh

      - name: Stage prepared files for drift checks
        run: |
          git add --all -- versions.env Dockerfile src/header.html src/footer.html \
            test/fetch-sources_test.sh test/image-overlay_test.sh web

      - name: Verify lock and generated drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/update-lock.sh --verify-lock
          scripts/fetch-sources.sh
          npm run generate
          git diff --exit-code

      - name: Run shell tests
        run: |
          sh test/fetch-sources_test.sh
          sh test/entrypoint_test.sh
          sh test/update-lock_test.sh
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@${{ steps.versions.outputs.actionlint }}
          git diff --cached --check

      - name: Run Node tests
        run: npm test

      - name: Build amd64 image locally
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --iidfile /tmp/araihu-dex-amd64.iid \
            --cache-to type=local,dest=/tmp/araihu-dex-cache-amd64,mode=max \
            .

      - name: Build arm64 image locally
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --output type=oci,dest=/tmp/araihu-dex-arm64.oci.tar \
            --cache-from type=local,src=/tmp/araihu-dex-cache-amd64 \
            --cache-to type=local,dest=/tmp/araihu-dex-cache-arm64,mode=max \
            .

      - name: Record local image ID
        id: image
        run: echo "id=$(cat /tmp/araihu-dex-amd64.iid)" >> "$GITHUB_OUTPUT"

      - name: Verify filesystem overlay
        run: sh test/image-overlay_test.sh "${{ steps.image.outputs.id }}"

      - name: Run real-image acceptance
        run: scripts/test-image.sh "${{ steps.image.outputs.id }}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.id }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload update evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-upstream-evidence
          path: |
            .cache/update-report.md
            test-results/
            playwright-report/
            trivy-results.sarif
            web/manifest.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Create checksum-bound prepared update
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          base_commit=$(git rev-parse HEAD)
          test "$base_commit" = "$GITHUB_SHA"
          echo "base_commit=$base_commit" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bundle=.cache/prepared-update
          mkdir -p "$bundle"
          git diff --cached --binary --full-index > "$bundle/prepared-update.patch"
          cp .cache/update-report.md "$bundle/update-report.md"
          cp web/manifest.sha256 "$bundle/manifest.sha256"

          new_commit=$(sed -n 's/^DEX_COMMIT=//p' versions.env)
          new_digest=$(sed -n 's|^DEX_IMAGE=ghcr.io/dexidp/dex:master@||p' versions.env)
          patch_sha256=$(sha256sum "$bundle/prepared-update.patch" | awk '{print $1}')
          report_sha256=$(sha256sum "$bundle/update-report.md" | awk '{print $1}')
          manifest_sha256=$(sha256sum "$bundle/manifest.sha256" | awk '{print $1}')
          {
            echo 'format=1'
            echo "base_commit=$base_commit"
            echo "new_commit=$new_commit"
            echo "new_digest=$new_digest"
            echo "patch_sha256=$patch_sha256"
            echo "report_sha256=$report_sha256"
            echo "manifest_sha256=$manifest_sha256"
          } > "$bundle/metadata.env"
          metadata_sha256=$(sha256sum "$bundle/metadata.env" | awk '{print $1}')

          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$patch_sha256" >> "$GITHUB_OUTPUT"
          echo "report_sha256=$report_sha256" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "metadata_sha256=$metadata_sha256" >> "$GITHUB_OUTPUT"
          echo "new_commit=$new_commit" >> "$GITHUB_OUTPUT"
          echo "new_digest=$new_digest" >> "$GITHUB_OUTPUT"

      - name: Upload checksum-bound prepared update
        if: ${{ steps.bundle.outputs.changed == 'true' }}
        id: prepared_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/prepared-update/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified update proposal
    needs: verify
    if: ${{ needs.verify.result == 'success' && needs.verify.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out verified base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.base_commit }}
          persist-credentials: false

      - name: Download verified prepared update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: .cache/prepared-update

      - name: Validate prepared update
        id: validate
        shell: bash
        env:
          EXPECTED_BASE_COMMIT: ${{ needs.verify.outputs.base_commit }}
          EXPECTED_PATCH_SHA256: ${{ needs.verify.outputs.patch_sha256 }}
          EXPECTED_REPORT_SHA256: ${{ needs.verify.outputs.report_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
          EXPECTED_METADATA_SHA256: ${{ needs.verify.outputs.metadata_sha256 }}
          EXPECTED_NEW_COMMIT: ${{ needs.verify.outputs.new_commit }}
          EXPECTED_NEW_DIGEST: ${{ needs.verify.outputs.new_digest }}
          EXPECTED_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle=.cache/prepared-update
          metadata=$bundle/metadata.env
          patch=$bundle/prepared-update.patch
          report=$bundle/update-report.md
          manifest=$bundle/manifest.sha256
          test -f "$metadata"
          test -f "$patch"
          test -f "$report"
          test -f "$manifest"

          metadata_value() {
            local key=$1
            local count
            count=$(awk -F= -v key="$key" '$1 == key { count++ } END { print count + 0 }' "$metadata")
            test "$count" -eq 1
            awk -v prefix="$key=" 'index($0, prefix) == 1 { print substr($0, length(prefix) + 1); exit }' "$metadata"
          }

          test "$(wc -l < "$metadata" | tr -d ' ')" -eq 7
          test "$(metadata_value format)" = 1
          base_commit=$(metadata_value base_commit)
          new_commit=$(metadata_value new_commit)
          new_digest=$(metadata_value new_digest)
          patch_sha256=$(metadata_value patch_sha256)
          report_sha256=$(metadata_value report_sha256)
          manifest_sha256=$(metadata_value manifest_sha256)
          test "$base_commit" = "$EXPECTED_BASE_COMMIT"
          test "$base_commit" = "$EXPECTED_WORKFLOW_COMMIT"
          test "$(git rev-parse HEAD)" = "$base_commit"
          test "$new_commit" = "$EXPECTED_NEW_COMMIT"
          test "$new_digest" = "$EXPECTED_NEW_DIGEST"
          test "$patch_sha256" = "$EXPECTED_PATCH_SHA256"
          test "$report_sha256" = "$EXPECTED_REPORT_SHA256"
          test "$manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum "$metadata" | awk '{print $1}')" = "$EXPECTED_METADATA_SHA256"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$patch_sha256"
          test "$(sha256sum "$report" | awk '{print $1}')" = "$report_sha256"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$manifest_sha256"
          [[ "$new_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$new_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          git apply --check "$patch"
          git apply --index "$patch"
          test "$(git diff --cached --binary --full-index | sha256sum | awk '{print $1}')" = "$patch_sha256"
          git diff --exit-code
          git diff --cached --check

          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "$path" in
              versions.env|Dockerfile|src/header.html|src/footer.html) ;;
              test/fetch-sources_test.sh|test/image-overlay_test.sh) ;;
              web/*) ;;
              *) echo "unexpected prepared path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only -z)
          test "$changed" = true

          test "$(sed -n 's/^DEX_COMMIT=//p' versions.env)" = "$new_commit"
          test "$(sed -n 's|^DEX_IMAGE=ghcr.io/dexidp/dex:master@||p' versions.env)" = "$new_digest"
          grep -F -x -- "- New commit: \`$new_commit\`" "$report"
          grep -F -x -- "- New digest: \`$new_digest\`" "$report"
          grep -F -x -- "- Generated manifest digest: \`sha256:$manifest_sha256\`" "$report"

          mkdir -p .cache
          cp "$report" .cache/update-report.md
          echo "new_commit=$new_commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=${new_commit:0:12}" >> "$GITHUB_OUTPUT"

      - name: Configure write credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Create and push update branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_COMMIT: ${{ steps.validate.outputs.short_commit }}
        run: |
          branch="automation/update-dex-$SHORT_COMMIT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update Dex master to $SHORT_COMMIT"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_COMMIT: ${{ steps.validate.outputs.short_commit }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore: update Dex master to $SHORT_COMMIT" \
            --body-file .cache/update-report.md
