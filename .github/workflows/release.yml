name: Release GHCR image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/araihu/dex
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    name: Publish signed stable image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out release source without persisted credentials
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate stable tag and release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE:-}" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=${GITHUB_REF_NAME:-}
          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be canonical vX.Y.Z: $version" >&2
            exit 1
          fi

          source versions.env
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          image=${IMAGE:-ghcr.io/araihu/dex}
          test "$image" = ghcr.io/araihu/dex
          upstream_digest=${DEX_IMAGE##*@}
          [[ "$upstream_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          candidate="$image:candidate-${GITHUB_SHA}"

          {
            echo "version=$version"
            echo "created=$created"
            echo "candidate=$candidate"
            echo "node=$NODE_VERSION"
            echo "npm=$NPM_VERSION"
            echo "actionlint=$ACTIONLINT_VERSION"
            echo 'tags<<ARAIHU_TAGS'
            printf '%s\n' \
              "$image:$version" \
              "$image:$major.$minor" \
              "$image:$major" \
              "$image:latest"
            echo 'ARAIHU_TAGS'
            echo 'labels<<ARAIHU_LABELS'
            printf '%s\n' \
              "org.opencontainers.image.created=$created" \
              "org.opencontainers.image.revision=$GITHUB_SHA" \
              "org.opencontainers.image.version=$version" \
              'org.opencontainers.image.source=https://github.com/araihu/dex' \
              'org.opencontainers.image.licenses=Apache-2.0 AND MIT' \
              "io.araihu.dex.upstream.revision=$DEX_COMMIT" \
              "io.araihu.dex.upstream.digest=$upstream_digest" \
              "io.araihu.dex.goshtoso.version=$GOSHTOSO_VERSION" \
              "io.araihu.dex.assets.version=$ARAIHU_ASSETS_VERSION"
            echo 'ARAIHU_LABELS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.release.outputs.node }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install locked dependencies
        run: |
          npm install --global "npm@${{ steps.release.outputs.npm }}"
          npm ci

      - name: Verify locked upstream trust
        id: trust
        run: scripts/update-lock.sh --verify-lock

      - name: Generate and reject drift
        run: |
          scripts/fetch-sources.sh
          npm run generate
          git diff --exit-code

      - name: Run release policy and source tests
        run: |
          sh test/release-policy_test.sh
          sh test/fetch-sources_test.sh
          sh test/entrypoint_test.sh
          sh test/update-lock_test.sh
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@${{ steps.release.outputs.actionlint }}
          npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build local amd64 acceptance image
        env:
          LABELS: ${{ steps.release.outputs.labels }}
          LOCAL_IMAGE: araihu-dex-release:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r label; do
            test -z "$label" || label_args+=(--label "$label")
          done <<< "$LABELS"
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "$LOCAL_IMAGE" \
            "${label_args[@]}" \
            .

      - name: Run real-image and visual acceptance
        env:
          LOCAL_IMAGE: araihu-dex-release:${{ github.sha }}
        run: |
          sh test/image-overlay_test.sh "$LOCAL_IMAGE"
          scripts/test-image.sh "$LOCAL_IMAGE"

      - name: Scan local release candidate
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: araihu-dex-release:${{ github.sha }}
          format: sarif
          output: release-evidence/vulnerability-report.sarif

      - name: Log in to GHCR after all local gates
        id: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish exact OCI candidate
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          labels: ${{ steps.release.outputs.labels }}
          outputs: |
            type=oci,dest=${{ runner.temp }}/release.oci.tar
            type=registry,name=${{ steps.release.outputs.candidate }},push=true
          provenance: mode=max
          sbom: true

      - name: Verify local OCI candidate
        id: verify_local
        run: scripts/verify-release.sh local "$RUNNER_TEMP/release.oci.tar"

      - name: Resolve candidate digest
        id: candidate
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          OCI_ARCHIVE: ${{ runner.temp }}/release.oci.tar
        shell: bash
        run: |
          set -euo pipefail
          index_json=$(tar -xOf "$OCI_ARCHIVE" index.json)
          root_digest=$(printf '%s\n' "$index_json" | jq -r '
            if (.manifests | length) == 1
              and .manifests[0].mediaType == "application/vnd.oci.image.index.v1+json"
            then .manifests[0].digest
            else empty
            end
          ')
          if [[ -n "$root_digest" ]]; then
            [[ "$root_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            root_hex=${root_digest#sha256:}
            blob_digest="sha256:$(tar -xOf "$OCI_ARCHIVE" "blobs/sha256/$root_hex" | sha256sum | awk '{print $1}')"
            [[ "$blob_digest" = "$root_digest" ]]
            local_digest=$root_digest
          else
            local_digest="sha256:$(tar -xOf "$OCI_ARCHIVE" index.json | sha256sum | awk '{print $1}')"
          fi
          [[ "$local_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          remote_digest=$(docker buildx imagetools inspect "$CANDIDATE" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$remote_digest" = "$local_digest" ]] || {
            echo "candidate digest differs from locally verified OCI archive: $remote_digest != $local_digest" >&2
            exit 1
          }
          echo "digest=$local_digest" >> "$GITHUB_OUTPUT"

      - name: Create GitHub build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign candidate digest keylessly
        id: sign
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify signed candidate and workflow identity
        id: verify_candidate
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release.sh remote "$CANDIDATE"

      - name: Promote verified candidate to stable tags
        id: promote
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          TAGS: ${{ steps.release.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -n "$tag"
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
          done <<< "$TAGS"

      - name: Verify promoted stable tags and workflow identity
        id: verify_aliases
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release.sh remote "$IMAGE@$DIGEST"

      - name: Collect immutable release evidence
        id: evidence
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > release-evidence/release-manifest.json
          sha256sum release-evidence/release-manifest.json > release-evidence/release-manifest.json.sha256
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .SBOM }}' |
            jq . > release-evidence/sbom.spdx.json
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .Provenance }}' |
            jq . > release-evidence/provenance.slsa.json
          cp web/manifest.sha256 release-evidence/frontend-manifest.sha256
          sha256sum release-evidence/frontend-manifest.sha256 > release-evidence/frontend-manifest.sha256.sha256
          cp "$ATTESTATION_BUNDLE" release-evidence/github-attestation.sigstore.json

      - name: Upload release evidence
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            release-evidence/
            web/manifest.sha256
            test/screenshots/araihu/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 90
