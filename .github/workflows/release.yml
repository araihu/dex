name: Release GHCR image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/araihu/dex
  PLATFORM: linux/amd64

jobs:
  release:
    name: Publish signed stable image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out release source without persisted credentials
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate stable tag and release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE:-}" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=${GITHUB_REF_NAME:-}
          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be canonical vX.Y.Z: $version" >&2
            exit 1
          fi

          source versions.env
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          image=${IMAGE:-ghcr.io/araihu/dex}
          test "$image" = ghcr.io/araihu/dex
          upstream_digest=${DEX_IMAGE##*@}
          [[ "$upstream_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          created=$(python3 - "$source_date_epoch" <<'PY'
          import datetime
          import sys

          timestamp = datetime.datetime.fromtimestamp(
              int(sys.argv[1]), datetime.timezone.utc
          )
          print(timestamp.isoformat(timespec="seconds").replace("+00:00", "Z"))
          PY
          )
          [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          candidate="$image:candidate-${GITHUB_SHA}"

          {
            echo "version=$version"
            echo "created=$created"
            echo "source_date_epoch=$source_date_epoch"
            echo "candidate=$candidate"
            echo "node=$NODE_VERSION"
            echo "npm=$NPM_VERSION"
            echo "actionlint=$ACTIONLINT_VERSION"
            echo 'tags<<ARAIHU_TAGS'
            printf '%s\n' \
              "$image:$version" \
              "$image:v$major.$minor" \
              "$image:v$major" \
              "$image:latest"
            echo 'ARAIHU_TAGS'
            echo 'labels<<ARAIHU_LABELS'
            printf '%s\n' \
              "org.opencontainers.image.created=$created" \
              "org.opencontainers.image.revision=$GITHUB_SHA" \
              "org.opencontainers.image.version=$version" \
              'org.opencontainers.image.source=https://github.com/araihu/dex' \
              'org.opencontainers.image.licenses=Apache-2.0 AND MIT AND OFL-1.1 AND BSD-3-Clause' \
              "io.araihu.dex.upstream.revision=$DEX_COMMIT" \
              "io.araihu.dex.upstream.digest=$upstream_digest" \
              "io.araihu.dex.goshtoso.version=$GOSHTOSO_VERSION" \
              "io.araihu.dex.assets.version=$ARAIHU_ASSETS_VERSION"
            echo 'ARAIHU_LABELS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.release.outputs.node }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install locked dependencies
        run: |
          npm install --global "npm@${{ steps.release.outputs.npm }}"
          npm ci

      - name: Verify locked upstream trust
        id: trust
        run: scripts/update-lock.sh --verify-lock

      - name: Generate and reject drift
        run: |
          scripts/fetch-sources.sh
          npm run generate
          git diff --exit-code

      - name: Run release policy and source tests
        run: |
          sh test/release-policy_test.sh
          sh test/fetch-sources_test.sh
          sh test/entrypoint_test.sh
          sh test/update-lock_test.sh
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@${{ steps.release.outputs.actionlint }}
          npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build local acceptance image
        id: local_image
        env:
          LABELS: ${{ steps.release.outputs.labels }}
          LOCAL_IMAGE: araihu-dex-release:${{ github.sha }}
          PLATFORM: ${{ env.PLATFORM }}
        shell: bash
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r label; do
            test -z "$label" || label_args+=(--label "$label")
          done <<< "$LABELS"
          docker buildx build \
            --platform "$PLATFORM" \
            --load \
            --tag "$LOCAL_IMAGE" \
            --build-arg "SOURCE_DATE_EPOCH=${{ steps.release.outputs.source_date_epoch }}" \
            "${label_args[@]}" \
            .

      - name: Run real-image and visual acceptance
        env:
          LOCAL_IMAGE: araihu-dex-release:${{ github.sha }}
        run: |
          sh test/image-overlay_test.sh "$LOCAL_IMAGE"
          scripts/test-image.sh "$LOCAL_IMAGE"

      - name: Prepare release evidence directory
        id: prepare_evidence
        run: mkdir -p release-evidence

      - name: Log in to GHCR after all local gates
        id: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish amd64 candidate
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          labels: ${{ steps.release.outputs.labels }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.release.outputs.source_date_epoch }}
          tags: ${{ steps.release.outputs.candidate }}
          push: true
          provenance: false
          sbom: false

      - name: Resolve candidate digest
        id: candidate
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          remote_digest=$(docker buildx imagetools inspect "$CANDIDATE" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$remote_digest" = "$DIGEST" ]]
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > "$RUNNER_TEMP/candidate-manifest.json"
          jq -e '.mediaType == "application/vnd.oci.image.manifest.v1+json"' "$RUNNER_TEMP/candidate-manifest.json" >/dev/null
          blob_digest="sha256:$(sha256sum "$RUNNER_TEMP/candidate-manifest.json" | awk '{print $1}')"
          [[ "$blob_digest" = "$DIGEST" ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Scan exact candidate manifest
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
          version: v0.74.0
          format: sarif
          output: release-evidence/vulnerability-report-amd64.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true

      - name: Sign candidate digest keylessly
        id: sign
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify signed candidate and workflow identity
        id: verify_candidate
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: scripts/verify-release.sh remote-candidate "$IMAGE@$DIGEST"

      - name: Collect immutable release evidence
        id: evidence
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > release-evidence/release-manifest.json
          sha256sum release-evidence/release-manifest.json > release-evidence/release-manifest.json.sha256
          cp web/manifest.sha256 release-evidence/frontend-manifest.sha256
          sha256sum release-evidence/frontend-manifest.sha256 > release-evidence/frontend-manifest.sha256.sha256
          for evidence_file in \
            release-evidence/vulnerability-report-amd64.sarif \
            release-evidence/release-manifest.json \
            release-evidence/release-manifest.json.sha256 \
            release-evidence/frontend-manifest.sha256 \
            release-evidence/frontend-manifest.sha256.sha256; do
            test -s "$evidence_file"
          done

      - name: Upload release evidence
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            release-evidence/
            web/manifest.sha256
            test/screenshots/araihu/
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 90

      - name: Promote verified candidate to stable tags
        id: promote
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          TAGS: ${{ steps.release.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -n "$tag"
            docker buildx imagetools create --prefer-index=false --tag "$tag" "$IMAGE@$DIGEST"
          done <<< "$TAGS"

      - name: Verify promoted stable tags and workflow identity
        id: verify_aliases
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: scripts/verify-release.sh remote "$IMAGE@$DIGEST"
